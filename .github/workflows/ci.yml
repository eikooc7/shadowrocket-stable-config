name: Config CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static rule and policy regression tests
        run: python scripts/validate.py
      - name: Build subscription artifact
        run: python scripts/build.py
      - name: Save artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadowrocket-config
          path: site/
